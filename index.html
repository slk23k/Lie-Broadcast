<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lie Broadcast — Fake It Till You Take It</title>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<style>
  :root {
    --bg-dark: #070b14; --bg-panel: #101726; --bg-card: #182236; --border: #273552;
    --text-main: #f1f5f9; --text-muted: #94a3b8;
    --red: #ef4444; --green: #10b981; --amber: #f59e0b; --blue: #3b82f6; --purple: #8b5cf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg-dark); color: var(--text-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }

  header { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; z-index: 10; }
  .brand-info { display: flex; flex-direction: column; min-width: 140px; max-width: 205px; }
  .brand-name { font-weight: 800; font-size: 0.98rem; color: var(--red); text-transform: uppercase; }
  .brand-myth { font-size: 0.72rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .stats-bar { display: flex; gap: 14px; align-items: center; flex: 1; justify-content: center; flex-wrap: wrap; }
  .stat-item { display: flex; flex-direction: column; min-width: 82px; }
  .stat-label { font-size: 0.62rem; text-transform: uppercase; color: var(--text-muted); }
  .stat-value { font-size: 0.96rem; font-weight: 700; display: flex; align-items: center; gap: 4px; }
  .stat-sub { font-size: 0.65rem; color: var(--text-muted); }
  .trend { font-size: 0.72rem; font-weight: 800; }
  .trend-up { color: var(--green); } .trend-down { color: var(--red); } .trend-flat { color: #64748b; }
  .val-money { color: var(--green); } .val-hype { color: var(--amber); } .val-viral { color: #ec4899; } .val-bel { color: var(--red); } .val-fc { color: var(--blue); }
  .progress-mini { width: 100%; height: 4px; background: #0f172a; border-radius: 3px; margin-top: 3px; overflow: hidden; }
  .progress-fill { height: 100%; transition: width 0.3s; }

  .controls { display: flex; align-items: center; gap: 6px; }
  .lang-switch { display: flex; background: var(--bg-dark); border: 1px solid var(--border); border-radius: 6px; padding: 2px; gap: 2px; }
  .lang-btn { background: transparent; color: var(--text-muted); border: none; padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; cursor: pointer; }
  .lang-btn.active { background: var(--amber); color: #090d16; }
  .day-badge { background: var(--bg-card); padding: 5px 9px; border-radius: 6px; font-weight: 600; font-size: 0.78rem; border: 1px solid var(--border); min-width: 68px; text-align: center; }
  .btn-icon { background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border); padding: 5px 9px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 0.8rem; }
  .btn-icon.active { background: var(--red); border-color: var(--red); }

  .ticker-wrap { background: #1a0b0e; border-bottom: 1px solid #451218; padding: 5px 16px; display: flex; align-items: center; gap: 10px; font-size: 0.82rem; }
  .ticker-badge { background: var(--red); color: #fff; font-weight: 800; font-size: 0.68rem; padding: 2px 7px; border-radius: 3px; text-transform: uppercase; }
  .ticker-text { color: #fecaca; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  main { display: flex; flex: 1; overflow: hidden; position: relative; }
  .map-container { flex: 1; position: relative; background: radial-gradient(circle at 50% 45%, #122038 0%, #070b14 100%); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .map-viewport { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  svg#world-map { width: 100%; height: 100%; }
  .graticule-line { stroke: #1e293b; stroke-width: 0.6; fill: none; opacity: 0.45; }
  .country-path { fill: #1b263b; stroke: #334155; stroke-width: 0.7; cursor: pointer; transition: fill 0.3s, stroke 0.15s; }
  .country-path:hover { stroke: #f8fafc; stroke-width: 1.5; filter: brightness(1.18); }
  .country-path.in-selected-region { stroke: #fbbf24; stroke-width: 1.25; }
  .country-path.picked-country { stroke: #ffffff; stroke-width: 1.9; }
  .route-land { stroke: #94a3b8; stroke-width: 1.4; stroke-dasharray: 3 3; opacity: 0.38; pointer-events: none; }
  .route-ocean { stroke: #38bdf8; stroke-width: 1.4; stroke-dasharray: 5 5; opacity: 0.38; pointer-events: none; }
  .route-ocean.unlocked { stroke: #ec4899; stroke-dasharray: 5 3; opacity: 0.85; }
  .region-hub-dot { fill: #f59e0b; stroke: #090d16; stroke-width: 1.5; pointer-events: none; }
  .region-label { fill: #f8fafc; font-size: 11px; font-weight: 800; pointer-events: none; text-anchor: middle; paint-order: stroke; stroke: #070b14; stroke-width: 3px; stroke-linejoin: round; }
  .region-pct { fill: #fde68a; font-size: 10px; font-weight: 700; pointer-events: none; text-anchor: middle; paint-order: stroke; stroke: #070b14; stroke-width: 2.8px; stroke-linejoin: round; }

  .viral-bubble { position: absolute; background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; border: 2px solid #fff; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.78rem; cursor: pointer; box-shadow: 0 0 18px rgba(239,68,68,0.7); animation: float 2s ease-in-out infinite; z-index: 20; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

  .map-legend { position: absolute; top: 12px; left: 12px; background: rgba(16,23,38,0.88); border: 1px solid var(--border); padding: 7px 10px; border-radius: 8px; font-size: 0.7rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 3px; z-index: 5; }
  .region-card { position: absolute; bottom: 12px; left: 12px; background: rgba(16,23,38,0.95); backdrop-filter: blur(8px); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; width: 244px; box-shadow: 0 8px 24px rgba(0,0,0,0.65); z-index: 5; }
  .region-card h3 { font-size: 0.88rem; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .region-sub-country { font-size: 0.7rem; color: #38bdf8; font-weight: 600; margin-bottom: 6px; }
  .region-stat { display: flex; justify-content: space-between; font-size: 0.71rem; color: var(--text-muted); margin-bottom: 3px; }
  .region-stat span:last-child { color: var(--text-main); font-weight: 600; }
  .rc-actions { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .btn-action { width: 100%; padding: 6px; border: none; border-radius: 5px; font-weight: 700; cursor: pointer; font-size: 0.71rem; color: #fff; }
  .btn-ad { background: var(--blue); } .btn-buyout { background: var(--purple); }
  .btn-action:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  .monopoly-badge { background: var(--purple); color: #fff; font-size: 0.58rem; padding: 2px 5px; border-radius: 4px; text-transform: uppercase; }

  aside { width: 390px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); align-items: center; }
  .tab-btn { flex: 1; padding: 11px 5px; background: transparent; border: none; color: var(--text-muted); font-weight: 700; font-size: 0.75rem; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab-btn.active { color: var(--red); border-bottom-color: var(--red); background: rgba(239,68,68,0.06); }
  .tab-content { flex: 1; overflow-y: auto; padding: 12px 14px; display: none; flex-direction: column; gap: 10px; }
  .tab-content.active { display: flex; }
  .region-banner { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.35); padding: 8px 10px; border-radius: 6px; font-size: 0.78rem; color: #fde68a; display: flex; justify-content: space-between; }
  .section-title { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
  .upgrade-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
  .upgrade-card.bought { border-color: var(--green); background: rgba(16,185,129,0.07); }
  .upgrade-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .upgrade-title { font-weight: 700; font-size: 0.84rem; }
  .upgrade-lvl { font-size: 0.68rem; background: #0f172a; color: var(--amber); padding: 2px 6px; border-radius: 4px; font-weight: 700; }
  .upgrade-cost { font-weight: 700; font-size: 0.83rem; color: var(--green); }
  .upgrade-desc { font-size: 0.74rem; color: var(--text-muted); line-height: 1.35; }
  .upgrade-btn { margin-top: 3px; padding: 6px; border-radius: 6px; border: none; font-weight: 700; font-size: 0.78rem; cursor: pointer; background: var(--blue); color: #fff; }
  .upgrade-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
  .upgrade-card.bought .upgrade-btn { background: var(--green); color: #064e3b; }

  .headline-box { background: #0f172a; border: 1px dashed var(--amber); border-radius: 8px; padding: 12px; text-align: center; font-weight: 700; font-size: 0.9rem; color: #fef3c7; line-height: 1.4; }
  .select-group { display: flex; flex-direction: column; gap: 4px; }
  .select-group label { font-size: 0.74rem; color: var(--text-muted); font-weight: 600; }
  select, .input-field { background: var(--bg-dark); color: var(--text-main); border: 1px solid var(--border); padding: 8px 10px; border-radius: 6px; font-size: 0.84rem; outline: none; width: 100%; }
  .input-field.input-error { border-color: var(--red); box-shadow: 0 0 0 2px rgba(239,68,68,0.35); }
  .error-hint { font-size: 0.72rem; color: var(--red); font-weight: 600; display: none; }
  .error-hint.show { display: block; }
  .btn-publish { padding: 11px; background: var(--amber); color: #000; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; font-size: 0.86rem; text-transform: uppercase; }
  .btn-publish:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(5,8,15,0.94); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; width: 92%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; max-height: 94vh; overflow-y: auto; }
  .modal > * { flex-shrink: 0; }
  .modal-top-row { display: flex; justify-content: space-between; align-items: center; }
  .start-logo-container { width: 100%; display: flex; justify-content: center; }
  .start-logo-img { width: 140px; height: 140px; object-fit: cover; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  .modal h1 { font-size: 1.35rem; color: var(--red); text-align: center; letter-spacing: 1px; }
  .modal-slogan { text-align: center; color: var(--amber); font-weight: 700; font-size: 0.78rem; text-transform: uppercase; margin-top: -6px; }
  .modal p { font-size: 0.82rem; color: var(--text-muted); text-align: center; line-height: 1.4; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; max-height: 112px; min-height: 76px; flex-shrink: 0; overflow-y: auto; padding-right: 4px; }
  .preset-chip { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 5px 10px; border-radius: 20px; font-size: 0.74rem; cursor: pointer; }
  .preset-chip:hover { border-color: var(--red); color: #fff; }
  .btn-start { padding: 11px; background: var(--red); color: #fff; border: none; border-radius: 8px; font-weight: 800; font-size: 0.92rem; cursor: pointer; text-transform: uppercase; }

  .studio-modal { max-width: 680px; padding: 0; overflow: hidden; border: 2px solid var(--amber); }
  .studio-modal.mode-debate { border-color: var(--red); }
  .studio-stage { position: relative; height: 210px; overflow: hidden; border-bottom: 3px solid #1e293b; }
  .studio-stage.theme-morning { background: linear-gradient(180deg, #0ea5e9 0%, #38bdf8 42%, #f59e0b 86%, #ea580c 100%); }
  .studio-stage.theme-debate { background: radial-gradient(circle at 20% 25%, rgba(239,68,68,0.45), transparent 55%), radial-gradient(circle at 80% 25%, rgba(59,130,246,0.45), transparent 55%), linear-gradient(180deg, #090d16 0%, #1e1b4b 100%); }
  .studio-city { position: absolute; bottom: 45px; left: 0; right: 0; height: 90px; opacity: 0.24; background: repeating-linear-gradient(90deg, #0f172a 0 28px, transparent 28px 42px, #0f172a 42px 64px, transparent 64px 72px); }
  .studio-onair { position: absolute; top: 12px; left: 16px; background: #dc2626; color: #fff; font-weight: 900; font-size: 0.74rem; padding: 4px 10px; border-radius: 4px; letter-spacing: 1.5px; z-index: 4; }
  .studio-show-banner { position: absolute; top: 12px; right: 16px; background: rgba(15,23,42,0.88); color: #fde68a; font-weight: 800; font-size: 0.73rem; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--amber); z-index: 4; }
  .studio-screen { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); width: 255px; min-height: 72px; background: rgba(15,23,42,0.94); border: 2.5px solid #38bdf8; border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; z-index: 2; }
  .studio-screen-title { font-size: 0.73rem; font-weight: 900; color: var(--amber); text-transform: uppercase; margin-bottom: 3px; }
  .studio-screen-myth { font-size: 0.76rem; font-weight: 600; color: #e2e8f0; line-height: 1.25; }
  .studio-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
  .talking { animation: talkBob 0.2s ease-in-out infinite alternate; }
  @keyframes talkBob { from{transform:translateY(0)} to{transform:translateY(-4px)} }
  .studio-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .studio-dialogue { background: #0f172a; border-left: 4px solid var(--amber); padding: 10px 12px; border-radius: 6px; font-size: 0.85rem; line-height: 1.4; }
  .studio-dialogue strong { color: var(--amber); }
  .debate-options { display: flex; flex-direction: column; gap: 7px; }
  .debate-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 9px 12px; border-radius: 8px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .debate-btn:hover:not(:disabled) { border-color: var(--amber); background: #232f47; }
  .debate-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .debate-btn-title { font-weight: 700; font-size: 0.82rem; }
  .debate-btn.decline { border-color: #7f1d1d; background: rgba(127,29,29,0.2); }

  /* Mobile UI elements (hidden on desktop) */
  .mobile-only { display: none !important; }
  #btn-mobile-menu {
    position: absolute; bottom: 12px; right: 12px; z-index: 25;
    background: linear-gradient(135deg, var(--red), #b91c1c); color: #fff;
    border: 2px solid #fca5a5; border-radius: 30px; padding: 10px 16px;
    font-weight: 800; font-size: 0.82rem; cursor: pointer;
    box-shadow: 0 6px 20px rgba(239,68,68,0.55);
  }
  #btn-close-aside {
    background: #1e293b; color: #f8fafc; border: none; border-left: 1px solid var(--border);
    padding: 10px 14px; font-weight: 900; font-size: 0.9rem; cursor: pointer;
  }
  .settings-grid { display: flex; flex-direction: column; gap: 10px; }
  .settings-row { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); font-size: 0.84rem; font-weight: 600; }

  .hidden { display: none !important; }

  /* Mobile Landscape & Portrait / Compact screens */
  @media (max-width: 950px), (max-height: 540px) {
    .mobile-only { display: inline-flex !important; align-items: center; justify-content: center; }
    .desktop-only { display: none !important; }
    header { padding: 4px 10px; gap: 8px; }
    .brand-info { display: none; }
    .stats-bar { gap: 8px; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; }
    .stat-item { min-width: auto; }
    .stat-label, .stat-sub, .progress-mini { display: none; }
    .stat-value { font-size: 0.82rem; white-space: nowrap; }
    .day-badge { padding: 3px 7px; font-size: 0.72rem; min-width: 54px; }
    .ticker-wrap { padding: 3px 10px; font-size: 0.72rem; }
    .map-legend { display: none; }
    .region-card { width: 196px; padding: 7px 9px; bottom: 8px; left: 8px; }
    .region-card h3 { font-size: 0.78rem; }
    .region-sub-country { font-size: 0.64rem; margin-bottom: 3px; }
    .region-stat { font-size: 0.65rem; margin-bottom: 1px; }
    .rc-actions { margin-top: 5px; gap: 4px; }
    .btn-action { padding: 5px; font-size: 0.66rem; }

    aside {
      position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 88vw;
      z-index: 60; box-shadow: -8px 0 30px rgba(0,0,0,0.8);
      transform: translateX(100%); transition: transform 0.25s ease;
    }
    aside.open { transform: translateX(0); }
    .start-logo-img { width: 92px; height: 92px; }
    .modal { padding: 12px 16px; gap: 7px; }
    .studio-stage { height: 150px; }
    .studio-body { padding: 10px 14px; gap: 7px; }
  }

  /* Mobile Portrait (вертикальная версия с крупной картой и свайпом) */
  @media (max-width: 768px) and (orientation: portrait) {
    .map-container { align-items: flex-start; padding-top: 0; }
    .map-viewport {
      width: 100%; height: calc(100% - 210px);
      overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      display: block;
    }
    svg#world-map { width: 920px; height: 100%; display: block; }
    .region-card {
      left: 10px; right: 10px; bottom: 60px; width: auto;
      padding: 9px 12px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px;
    }
    .region-card h3, .region-sub-country, .rc-actions { grid-column: 1 / -1; }
    .rc-actions { flex-direction: row; gap: 6px; margin-top: 7px; }
    .btn-action { padding: 8px 6px; font-size: 0.72rem; }
    #btn-mobile-menu {
      left: 10px; right: 10px; bottom: 10px; width: calc(100% - 20px);
      padding: 11px; font-size: 0.86rem; border-radius: 10px;
    }
    aside { width: 100%; max-width: 100vw; }
    .studio-stage { height: 175px; }
  }
</style>
</head>
<body>

<div class="modal-overlay" id="start-modal">
  <div class="modal">
    <div class="modal-top-row">
      <span style="font-size:0.74rem; color:var(--text-muted); font-weight:700;">FAKE IT TILL YOU TAKE IT</span>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru" onclick="setLanguage('ru')">RU</button>
        <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
        <button class="lang-btn" data-lang="es" onclick="setLanguage('es')">ES</button>
      </div>
    </div>

    <div class="start-logo-container">
      <img src="lie_broadcast_logo.jpeg" alt="Lie Broadcast" class="start-logo-img" onerror="this.style.display='none'">
    </div>

    <h1>LIE BROADCAST</h1>
    <div class="modal-slogan" id="start-subtitle">Симулятор Медиаимперии</div>
    <p id="start-desc"></p>

    <div class="select-group">
      <label id="lbl-player"></label>
      <input type="text" id="input-player" class="input-field" value="" placeholder="Введите имя" maxlength="20" required>
      <span class="error-hint" id="player-error">Введите имя, чтобы начать эфир</span>
    </div>
    <div class="select-group">
      <label id="lbl-media"></label>
      <input type="text" id="input-media" class="input-field" value="Правда 24" maxlength="25">
    </div>
    <div class="select-group">
      <label id="lbl-myth"></label>
      <input type="text" id="input-myth" class="input-field" value="Земля на самом деле плоская" maxlength="65">
    </div>
    <div class="presets" id="presets-container"></div>
    <button class="btn-start" id="btn-start-game" onclick="startGame()"></button>
  </div>
</div>

<div class="modal-overlay hidden" id="settings-modal">
  <div class="modal" style="max-width:360px;">
    <div class="modal-top-row">
      <h2 id="settings-title" style="font-size:1.05rem;color:var(--amber);">⚙️ Настройки</h2>
      <button class="btn-icon" onclick="toggleSettingsModal(false)">✕</button>
    </div>
    <div class="settings-grid">
      <div class="settings-row">
        <span id="set-lbl-lang">Язык</span>
        <div class="lang-switch">
          <button class="lang-btn active" data-lang="ru" onclick="setLanguage('ru')">RU</button>
          <button class="lang-btn" data-lang="en" onclick="setLanguage('en')">EN</button>
          <button class="lang-btn" data-lang="es" onclick="setLanguage('es')">ES</button>
        </div>
      </div>
      <div class="settings-row">
        <span id="set-lbl-music">Музыка</span>
        <button class="btn-icon active" id="m-btn-music" onclick="toggleMusic()">🎵</button>
      </div>
      <div class="settings-row">
        <span id="set-lbl-genre">Стиль (Джаз / Фонк)</span>
        <button class="btn-icon" id="m-btn-genre" onclick="toggleGenre()">🎷</button>

// --- MAP (REAL COUNTRIES + AUTOMATIC FALLBACK) ---
let mapProj = null;
function classifyCountry(lon, lat) {
  if (lat < -58) return null;
  if (lon < -30) return lat > 12 ? "na" : "sa";
  if (lat < 35 && lon >= -20 && lon <= 52) return (lon > 32 && lat > 12) ? "me" : "af";
  if (lon > 110 && lat < 8) return "oc";
  if (lon >= 24 && lon <= 175 && lat >= 46) return "ru";
  if (lon >= -12 && lon <= 45 && lat >= 35) return "eu";
  if (lon > 32 && lon <= 62 && lat >= 12 && lat < 42) return "me";
  return "as";
}

function initWorldMap() {
  try {
    if (window.d3 && window.topojson && typeof d3.geoNaturalEarth1 === "function") {
      mapProj = d3.geoNaturalEarth1().scale(178).translate([480, 262]);
      const pathGen = d3.geoPath().projection(mapProj);
      document.getElementById("map-graticule").innerHTML = `<path class="graticule-line" d="${pathGen(d3.geoGraticule10())}" />`;

      fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
        .then(r => { if (!r.ok) throw new Error(); return r.json(); })
        .then(world => {
          const geo = topojson.feature(world, world.objects.countries);
          const g = document.getElementById("map-countries"); g.innerHTML = "";
          geo.features.forEach(f => {
            const c = d3.geoCentroid(f);
            if (!c || Number.isNaN(c[0])) return;
            const regId = classifyCountry(c[0], c[1]);
            const dAttr = pathGen(f); if (!dAttr) return;
            const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
            p.setAttribute("d", dAttr); p.setAttribute("class", "country-path");
            if (regId) {
              const cname = (f.properties && f.properties.name) || "";
              p.setAttribute("data-region", regId);
              if (cname) p.setAttribute("data-country", cname);
              p.onclick = () => selectRegion(regId, cname);
            } else { p.style.fill = "#0f172a"; p.style.cursor = "default"; }
            g.appendChild(p);
          });
          renderRoutesAndMarkers(false);
          updateMapVisuals();
        })
        .catch(() => renderFallbackMap());
      return;
    }
  } catch (e) { console.warn("Map fallback:", e); }
  renderFallbackMap();
}

function renderFallbackMap() {
  const g = document.getElementById("map-countries"); g.innerHTML = "";
  const shapes = {
    na: "M70,80 L220,55 L300,115 L245,195 L145,205 L95,155 Z",
    sa: "M225,245 L315,245 L355,320 L300,445 L255,445 L220,335 Z",
    eu: "M425,95 L540,75 L555,155 L445,175 Z",
    af: "M435,205 L545,200 L585,295 L535,415 L465,405 L425,285 Z",
    me: "M545,165 L625,170 L635,245 L555,235 Z",
    ru: "M550,65 L805,70 L820,145 L555,150 Z",
    as: "M635,155 L830,155 L815,265 L665,270 Z",
    oc: "M755,335 L865,330 L880,415 L770,420 Z"
  };
  Object.entries(shapes).forEach(([id, dAttr]) => {
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", dAttr); p.setAttribute("class", "country-path");
    p.setAttribute("data-region", id); p.onclick = () => selectRegion(id, "");
    g.appendChild(p);
  });
  renderRoutesAndMarkers(true);
  updateMapVisuals();
}

function renderRoutesAndMarkers(useFallback) {
  const rg = document.getElementById("map-routes"), mg = document.getElementById("map-markers");
  rg.innerHTML = ""; mg.innerHTML = "";
  const pt = r => (!useFallback && mapProj) ? mapProj([r.lon, r.lat]) : [r.fx, r.fy];
  const drawn = new Set();
  regions.forEach(r => {
    const p1 = pt(r);
    r.links.forEach(l => {
      const key = [r.id, l.to].sort().join("-");
      if (!drawn.has(key)) {
        drawn.add(key);
        const p2 = pt(regions.find(x => x.id === l.to));
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", p1[0]); line.setAttribute("y1", p1[1]);
        line.setAttribute("x2", p2[0]); line.setAttribute("y2", p2[1]);
        line.setAttribute("class", l.ocean ? "route-ocean" : "route-land");
        if (l.ocean) line.setAttribute("data-ocean", "1");
        rg.appendChild(line);
      }
    });
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.innerHTML = `<circle cx="${p1[0]}" cy="${p1[1]-12}" r="4" class="region-hub-dot"/><text x="${p1[0]}" y="${p1[1]+2}" class="region-label" id="label-${r.id}">${getRegionName(r.id)}</text><text x="${p1[0]}" y="${p1[1]+15}" class="region-pct" id="pct-${r.id}">0%</text>`;
    mg.appendChild(g);
  });
}

function buyRegionalAd() {
  const d = t(), r = regions.find(x => x.id === state.selectedRegionId); if (!r) return;

    registerAction(); r.sideFakeCd = 15;

function publishHeadline() {
  if (state.headlineCooldown > 0) return;
  registerAction();
  const trigSel = document.getElementById("hl-trigger");
  const a = trigSel.value, b = document.getElementById("hl-proof").value;
  const idx = trigSel.selectedIndex;
  const mult = (a === state.lastHlTrigger || b === state.lastHlProof) ? 0.5 : 1.0;
  state.lastHlTrigger = a; state.lastHlProof = b; state.headlineCooldown = 10;

  let cash = Math.round((25 + getGlobalBel() * 2.2) * getHypeMult() * mult);
  let hg = Math.round(10 * mult);
  let belGain = 1.6 * mult;
  let fcDelta = 1.8 * state.defenseFactor;

  if (idx === 0) state.virality += Math.round(3 * mult);
  else if (idx === 1) belGain *= 1.8;
  else if (idx === 2) hg = Math.round(18 * mult);
  else if (idx === 3) cash = Math.round(cash * 1.9);
  else if (idx === 4) { hg = Math.round(14 * mult); state.virality += Math.round(2 * mult); }
  else if (idx === 5) fcDelta = -3 * mult;
  else if (idx === 6) { cash = Math.round(cash * 1.5); belGain *= 1.4; }

  state.money += cash;
  state.hype = Math.min(100, state.hype + hg);
  regions.forEach(r => {
    if (r.bel > 0 && !r.bought && r.bel < getRegionCap(r)) {
      r.bel = Math.min(getRegionCap(r), r.bel + belGain);
    }
  });
  state.factCheck = Math.max(0, Math.min(100, state.factCheck + fcDelta));
  setTicker(`${document.getElementById("headline-preview").textContent} (+${hg}% | +$${cash})`);
  updateUI();
}

function resolveDebate(type, chance, cost=0) {
  animateSpeaker("player"); playSimlish("player");
  document.getElementById("debate-modal").classList.add("hidden"); state.paused = false; if (musicEnabled) startJazz();
  if (type === "decline") {
    state.hype = Math.max(5, state.hype - 18); state.factCheck = Math.min(100, state.factCheck + 5 * state.defenseFactor);
    regions.forEach(r => { if (r.bel > 0 && !r.bought) r.bel = Math.max(0, r.bel - 2); });
  } else {
    registerAction(); state.money -= cost;
    if (Math.random() * 100 < chance) {
      state.hype = Math.min(100, state.hype + (type==="aggro"?20:type==="safe"?13:16));
      state.money += (type==="aggro"?130:type==="safe"?50:0);
    } else {
      state.hype = Math.max(5, state.hype - (type==="aggro"?22:14));
      state.factCheck = Math.min(100, state.factCheck + (type==="aggro"?8:5) * state.defenseFactor);
      regions.forEach(r => { if (r.bel > 0 && !r.bought) r.bel = Math.max(0, r.bel - (type==="aggro"?2.2:1)); });
    }
  }
  updateUI();
}

let tickTimer = null;
function gameLoop() { if (tickTimer) clearInterval(tickTimer); tickTimer = setInterval(()=>{ if (state.running && !state.paused) tick(); }, 1000 / state.speed); }
function getGlobalBel() { let p=0,b=0; regions.forEach(r=>{p+=r.pop; b+=r.pop*(r.bel/100);}); return (b/p)*100; }

function tick() {
  state.prevStats = { money:state.money, hype:state.hype, virality:state.virality, bel:getGlobalBel(), fc:state.factCheck };
  state.day++; state.daysSinceAction++; if (state.headlineCooldown > 0) state.headlineCooldown--;
  regions.forEach(r => { if (r.sideFakeCd > 0) r.sideFakeCd--; Object.values(r.upgState).forEach(s => { if (s.cd > 0) s.cd--; }); });
  state.hype = Math.max(8, state.hype - (state.daysSinceAction > 10 ? 0.55 : 0.24));
  if (state.daysSinceAction > 16 && state.virality > 5) state.virality = Math.max(5, +(state.virality - 0.25).toFixed(2));

  let inc = state.passiveIncome * getHypeMult();
  regions.forEach(r => {
    if (r.bel > 0 && !r.bought) {
      let sp = 0; regTemplates.forEach(u => sp += u.spreadBonus * r.upgState[u.id].level);
      const cap = getRegionCap(r), eduRes = Math.max(0.28, 1.32 - r.education / 100);
      const dec = 0.06 + r.education/1000 + (state.daysSinceAction>12?0.14:0) + (state.hype<25?0.1:0);
      if (sp > 0 && state.hype >= 18 && r.bel < cap) {
        const g = Math.max(0.05, (r.bel*(100-r.bel)/3600)) * sp * (0.5 + state.virality/75) * r.infoSpeed * eduRes * (state.hype/55);
        r.bel = Math.max(0, Math.min(cap, r.bel + g - dec));
      } else if (r.bel > cap || sp === 0 || state.hype < 18 || state.daysSinceAction > 12) {
        r.bel = Math.max(0, r.bel - dec);
      }
    }
    if (r.bel > 16 && state.hype > 30) {
      r.links.forEach(l => {
        const tg = regions.find(x => x.id === l.to);
        if (tg.bel === 0 && (!l.ocean || state.virality >= state.oceanThreshold) && Math.random() < (l.ocean?0.008:0.015)) tg.bel = 1.0;
      });
    }
    inc += getRegIncome(r);
  });

  state.money += Math.floor(inc);
  document.getElementById("ui-income").textContent = `+$${Math.floor(inc)}${t().perDay}`;
  const gb = getGlobalBel();
  if (gb > 2.5) state.factCheck = Math.min(100, state.factCheck + (0.075 + gb/160 + (state.hype/180)*0.12) * state.defenseFactor);
  if (state.day >= state.nextEventDay && gb > 0.8) { state.nextEventDay = state.day + 38 + Math.floor(Math.random()*18); triggerStudioEvent(); }
  if (Math.random() < 0.05) spawnBubble();

  const bought = regions.filter(r => r.bought).length;
  if (bought === regions.length) endGame(true, t().winDesc(state.day, state.mediaName, state.myth));
  else if (state.factCheck >= 100) endGame(false, t().loseDesc(state.day, state.mediaName));
  updateUI();
}

let audioCtx = null, musicInterval = null, musicEnabled = true, musicStep = 0;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const mCh = [{b:[130.8,164.8,196,164.8],k:[523.3,659.3,784]},{b:[174.6,220,261.6,220],k:[523.3,698.5,880]},{b:[196,246.9,293.7,246.9],k:[587.3,784,987.8]},{b:[130.8,196,261.6,196],k:[523.3,659.3,784]}];
const dCh = [{b:[73.4,73.4,87.3,73.4],k:[293.7,349.2,440]},{b:[58.3,58.3,73.4,58.3],k:[233.1,293.7,349.2]},{b:[65.4,65.4,77.8,65.4],k:[261.6,311.1,392]},{b:[55,55,69.3,55],k:[220,277.2,329.6]}];

const phonkCowbell = [587.3, 0, 587.3, 698.5, 0, 622.3, 587.3, 0, 523.3, 0, 587.3, 0, 698.5, 622.3, 587.3, 523.3];
const phonkBass    = [55, 0, 0, 55, 0, 0, 65.4, 0, 55, 0, 0, 49, 0, 55, 0, 0];

function playTone(f, type, time, dur, vol, ff=1200) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain(), fl = audioCtx.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(f, time); fl.type = "lowpass"; fl.frequency.setValueAtTime(ff, time);
  g.gain.setValueAtTime(0.0001, time); g.gain.linearRampToValueAtTime(vol, time + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  o.connect(fl); fl.connect(g); g.connect(audioCtx.destination); o.start(time); o.stop(time + dur + 0.05);
}

function playNoise(time, dur, vol, hpFreq) {
  const buf = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = audioCtx.createBufferSource(), fl = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
  src.buffer = buf; fl.type = "highpass"; fl.frequency.setValueAtTime(hpFreq, time);
  g.gain.setValueAtTime(vol, time); g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
  src.connect(fl); fl.connect(g); g.connect(audioCtx.destination); src.start(time);
}

function play808Kick(freq, time) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain(), fl = audioCtx.createBiquadFilter();
  o.type = "sawtooth"; o.frequency.setValueAtTime(freq * 2.4, time); o.frequency.exponentialRampToValueAtTime(freq, time + 0.07);
  fl.type = "lowpass"; fl.frequency.setValueAtTime(240, time);
  g.gain.setValueAtTime(0.001, time); g.gain.linearRampToValueAtTime(0.14, time + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, time + 0.34);
  o.connect(fl); fl.connect(g); g.connect(audioCtx.destination); o.start(time); o.stop(time + 0.36);
}

function playCowbell(freq, time) {
  const fl = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
  fl.type = "bandpass"; fl.frequency.setValueAtTime(freq * 1.4, time); fl.Q.value = 3.2;
  g.gain.setValueAtTime(0.001, time); g.gain.linearRampToValueAtTime(0.055, time + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, time + 0.16);
  fl.connect(g); g.connect(audioCtx.destination);
  [1, 1.48].forEach(ratio => {
    const o = audioCtx.createOscillator(); o.type = "square"; o.frequency.setValueAtTime(freq * ratio, time);
    o.connect(fl); o.start(time); o.stop(time + 0.17);
  });
}

function startPhonk() {
  state.audioMode = "phonk"; if (!musicEnabled) return; ensureAudio(); stopAllMusic();
  const playStep = () => {
    if (!musicEnabled || !audioCtx) return;
    const now = audioCtx.currentTime, step = musicStep % 16;
    if (phonkBass[step]) play808Kick(phonkBass[step], now);
    if (phonkCowbell[step]) playCowbell(phonkCowbell[step], now);
    if (step % 2 === 0 || step === 15) playNoise(now, 0.04, step % 4 === 0 ? 0.025 : 0.015, 7500);
    if (step === 4 || step === 12) playNoise(now, 0.12, 0.05, 1600);
    musicStep++;
  };
  playStep();
  musicInterval = setInterval(playStep, 115);
}

function startTrack(mode, chords, ms, bassType) {
  state.audioMode = mode; if (!musicEnabled) return; ensureAudio(); stopAllMusic();
  const playBeat = () => {
    if (!musicEnabled || !audioCtx) return;
    const now = audioCtx.currentTime, c = chords[Math.floor(musicStep/4) % chords.length], bt = musicStep % 4;
    playTone(c.b[bt], bassType, now, ms/1200, 0.075, 650);
    if (bt === 0 || (mode==="morning" && bt===2)) c.k.forEach((f,i) => playTone(f, mode==="morning"?"sine":"triangle", now + i*0.025, ms/500, 0.022, 1400));
    musicStep++;
  };
  playBeat();
  musicInterval = setInterval(playBeat, ms);
}

const startJazz = () => {
  if (state.musicGenre === "phonk") { startPhonk(); return; }
  startTrack("jazz", jCh, 660, "sine");
};
const startMorningShowMusic = () => startTrack("morning", mCh, 440, "triangle");
const startDebateMusic = () => startTrack("debate", dCh, 500, "sawtooth");

function toggleGenre() {
  state.musicGenre = state.musicGenre === "jazz" ? "phonk" : "jazz";
  syncControlButtons();
  if (musicEnabled && (state.audioMode === "jazz" || state.audioMode === "phonk")) startJazz();
}

function playSimlish(who="host") {
  if (!musicEnabled) return; ensureAudio();
  const now = audioCtx.currentTime, bp = who==="host"?210:155, vw = [450,700,1100,1500,1900];
  for (let i=0; i<5; i++) {
    const s = now + i*0.11, o = audioCtx.createOscillator(), f = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
    o.type = "sawtooth"; o.frequency.setValueAtTime(bp + (Math.random()-0.5)*60, s);
    f.type = "bandpass"; f.frequency.setValueAtTime(vw[Math.floor(Math.random()*vw.length)], s); f.Q.value = 3.5;
    g.gain.setValueAtTime(0.001, s); g.gain.linearRampToValueAtTime(0.055, s+0.02); g.gain.exponentialRampToValueAtTime(0.001, s+0.09);
    o.connect(f); f.connect(g); g.connect(audioCtx.destination); o.start(s); o.stop(s+0.1);
  }
}

function toggleMusic() {
  musicEnabled = !musicEnabled;
  syncControlButtons();
  if (musicEnabled) {
    if (state.audioMode==="morning") startMorningShowMusic();
    else if (state.audioMode==="debate") startDebateMusic();
    else startJazz();
  } else stopAllMusic();
}

document.getElementById("input-myth").addEventListener("input", () => { state.customMyth = true; });
document.getElementById("input-player").addEventListener("input", e => {
  if (e.target.value.trim()) {
    e.target.classList.remove("input-error");
    document.getElementById("player-error").classList.remove("show");
  }
});
applyStatic();
</script>
